name: Build and Release Kypseli

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset_name: kypseli-linux.tar.gz
          - os: macos-latest
            asset_name: kypseli-macos.tar.gz
          - os: windows-latest
            asset_name: kypseli-windows-installer.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      # ============== LINUX BUILD ==============
      - name: Build with PyInstaller (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          pyinstaller src/file_organizer/__main__.py \
            --onedir --name kypseli --clean --paths src \
            --collect-all file_organizer \
            --collect-all rich \
            --collect-all docx \
            --collect-all pptx \
            --collect-all pypdf \
            --collect-all rarfile \
            --collect-all py7zr \
            --hidden-import pandas \
            --hidden-import cv2 \
            --hidden-import PIL \
            --hidden-import pillow_heif \
            --hidden-import pypdf \
            --hidden-import docx \
            --hidden-import pptx \
            --hidden-import ebooklib \
            --hidden-import bs4 \
            --hidden-import tiktoken \
            --hidden-import openpyxl \
            --hidden-import tabulate \
            --hidden-import rarfile \
            --hidden-import py7zr \
            --hidden-import sqlite3 \
            --hidden-import striprtf \
            --exclude-module matplotlib \
            --exclude-module scipy \
            --exclude-module numpy.testing \
            --exclude-module pandas.tests \
            --exclude-module IPython \
            --exclude-module jupyter \
            --exclude-module pytest \
            --exclude-module sphinx \
            --exclude-module tkinter \
            --exclude-module unittest \
            --exclude-module pydoc \
            --exclude-module doctest \
            --exclude-module lib2to3 \
            --exclude-module curses \
            --exclude-module PIL.ImageQt \
            --exclude-module cv2.gapi \
            --exclude-module cv2.cuda \
            --exclude-module cv2.ml \
            --exclude-module cv2.dnn \
            --exclude-module debugpy \
            --exclude-module setuptools \
            --exclude-module pkg_resources

      - name: Check Linux build size
        if: matrix.os == 'ubuntu-22.04'
        run: |
          echo "Build size:"
          du -sh dist/kypseli/

      # ============== MACOS BUILD ==============
      - name: Build with PyInstaller (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller src/file_organizer/__main__.py \
            --onedir --name kypseli --clean --paths src \
            --collect-all file_organizer \
            --collect-all rich \
            --collect-all docx \
            --collect-all pptx \
            --collect-all pypdf \
            --collect-all rarfile \
            --collect-all py7zr \
            --hidden-import pandas \
            --hidden-import cv2 \
            --hidden-import PIL \
            --hidden-import pillow_heif \
            --hidden-import pypdf \
            --hidden-import docx \
            --hidden-import pptx \
            --hidden-import ebooklib \
            --hidden-import bs4 \
            --hidden-import tiktoken \
            --hidden-import openpyxl \
            --hidden-import tabulate \
            --hidden-import rarfile \
            --hidden-import py7zr \
            --hidden-import sqlite3 \
            --hidden-import striprtf \
            --exclude-module matplotlib \
            --exclude-module scipy \
            --exclude-module numpy.testing \
            --exclude-module pandas.tests \
            --exclude-module IPython \
            --exclude-module jupyter \
            --exclude-module pytest \
            --exclude-module sphinx \
            --exclude-module tkinter \
            --exclude-module unittest \
            --exclude-module pydoc \
            --exclude-module doctest \
            --exclude-module lib2to3 \
            --exclude-module curses \
            --exclude-module PIL.ImageQt \
            --exclude-module cv2.gapi \
            --exclude-module cv2.cuda \
            --exclude-module cv2.ml \
            --exclude-module cv2.dnn \
            --exclude-module debugpy \
            --exclude-module setuptools \
            --exclude-module pkg_resources

      - name: Check macOS build size
        if: matrix.os == 'macos-latest'
        run: |
          echo "Build size:"
          du -sh dist/kypseli/

      # ============== WINDOWS BUILD ==============
      - name: Create Windows icon files
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          python -c "
          from PIL import Image
          
          logo = Image.open('assets/logo.png')
          
          # Create ICO
          logo.save('assets/logo.ico', format='ICO', sizes=[(16,16), (32,32), (48,48), (64,64), (128,128), (256,256)])
          
          # Create wizard-large.bmp (164x314)
          large = Image.new('RGB', (164, 314), 'white')
          logo_resized = logo.copy()
          logo_resized.thumbnail((140, 140))
          x = (164 - logo_resized.width) // 2
          y = 50
          if logo_resized.mode == 'RGBA':
              large.paste(logo_resized, (x, y), logo_resized)
          else:
              large.paste(logo_resized, (x, y))
          large.save('assets/wizard-large.bmp', format='BMP')
          
          # Create wizard-small.bmp (55x58)
          small = Image.new('RGB', (55, 58), 'white')
          logo_small = logo.copy()
          logo_small.thumbnail((50, 50))
          x = (55 - logo_small.width) // 2
          y = (58 - logo_small.height) // 2
          if logo_small.mode == 'RGBA':
              small.paste(logo_small, (x, y), logo_small)
          else:
              small.paste(logo_small, (x, y))
          small.save('assets/wizard-small.bmp', format='BMP')
          
          print('Created icon files')
          "

      - name: Build with PyInstaller (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          pyinstaller src/file_organizer/__main__.py `
            --onedir --name kypseli --clean --paths src `
            --icon=assets/logo.ico `
            --collect-all file_organizer `
            --collect-all rich `
            --collect-all docx `
            --collect-all pptx `
            --collect-all pypdf `
            --collect-all rarfile `
            --collect-all py7zr `
            --hidden-import pandas `
            --hidden-import cv2 `
            --hidden-import PIL `
            --hidden-import pillow_heif `
            --hidden-import pypdf `
            --hidden-import docx `
            --hidden-import pptx `
            --hidden-import ebooklib `
            --hidden-import bs4 `
            --hidden-import tiktoken `
            --hidden-import openpyxl `
            --hidden-import tabulate `
            --hidden-import rarfile `
            --hidden-import py7zr `
            --hidden-import sqlite3 `
            --hidden-import striprtf `
            --exclude-module matplotlib `
            --exclude-module scipy `
            --exclude-module numpy.testing `
            --exclude-module pandas.tests `
            --exclude-module IPython `
            --exclude-module jupyter `
            --exclude-module pytest `
            --exclude-module sphinx `
            --exclude-module tkinter `
            --exclude-module unittest `
            --exclude-module pydoc `
            --exclude-module doctest `
            --exclude-module lib2to3 `
            --exclude-module curses `
            --exclude-module PIL.ImageQt `
            --exclude-module cv2.gapi `
            --exclude-module cv2.cuda `
            --exclude-module cv2.ml `
            --exclude-module cv2.dnn `
            --exclude-module debugpy `
            --exclude-module setuptools `
            --exclude-module pkg_resources

      # ============== VERIFY BUILD ==============
      - name: Verify build output (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          echo "Contents of dist folder:"
          ls -la dist/kypseli/
          
          if [ -f "dist/kypseli/kypseli" ]; then
            echo "Build successful: kypseli found"
            echo "Testing version command:"
            ./dist/kypseli/kypseli version
          else
            echo "ERROR: kypseli not found!"
            exit 1
          fi

      - name: Verify build output (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Write-Host "Contents of dist folder:"
          Get-ChildItem -Path dist\kypseli | Select-Object Name, Length
          
          if (Test-Path "dist\kypseli\kypseli.exe") {
            Write-Host "Build successful: kypseli.exe found"
            Write-Host "Testing version command:"
            & dist\kypseli\kypseli.exe version
          } else {
            Write-Host "ERROR: kypseli.exe not found!"
            exit 1
          }

      # ============== PACKAGE ==============
      - name: Package for Linux
        if: matrix.os == 'ubuntu-22.04'
        run: |
          cd dist
          chmod +x kypseli/kypseli
          tar -czvf kypseli-linux.tar.gz kypseli/
          mv kypseli-linux.tar.gz ../
          echo "Final package size:"
          ls -lh ../kypseli-linux.tar.gz

      - name: Package for macOS
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          chmod +x kypseli/kypseli
          tar -czvf kypseli-macos.tar.gz kypseli/
          mv kypseli-macos.tar.gz ../
          echo "Final package size:"
          ls -lh ../kypseli-macos.tar.gz

      - name: Create Windows Installer (Inno Setup)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer_output
          iscc installer.iss
          Write-Host "Final installer size:"
          Get-ChildItem installer_output

      # ============== PREPARE ASSETS ==============
      - name: Prepare Linux Asset
        if: matrix.os == 'ubuntu-22.04'
        run: |
          mkdir -p final_assets
          mv kypseli-linux.tar.gz final_assets/

      - name: Prepare macOS Asset
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p final_assets
          mv kypseli-macos.tar.gz final_assets/

      - name: Prepare Windows Asset
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path final_assets
          Move-Item installer_output\kypseli-setup.exe final_assets\${{ matrix.asset_name }}

      # ============== UPLOAD ==============
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: final_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}