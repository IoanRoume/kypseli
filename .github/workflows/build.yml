name: Build and Release Kypseli

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: kypseli
            asset_name: kypseli-linux
          - os: macos-latest
            artifact_name: kypseli
            asset_name: kypseli-macos
          - os: windows-latest
            artifact_name: kypseli.exe
            asset_name: kypseli-windows.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller src/file_organizer/__main__.py \
            --onefile --name kypseli --clean --paths src \
            --collect-all file_organizer --collect-all rich \
            --hidden-import pandas --hidden-import cv2 \
            --hidden-import PIL --hidden-import pillow_heif \
            --hidden-import pypdf --hidden-import python-docx \
            --hidden-import python-pptx --hidden-import ebooklib \
            --hidden-import bs4 --hidden-import tiktoken

      - name: Rename binary
        shell: bash
        run: |
          mv dist/${{ matrix.artifact_name }} dist/${{ matrix.asset_name }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: dist/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}