name: Build and Release Kypseli

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: kypseli
            asset_name: kypseli-linux
          - os: macos-latest
            artifact_name: kypseli
            asset_name: kypseli-macos
          - os: windows-latest
            artifact_name: kypseli.exe
            asset_name: kypseli-windows-installer.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      - name: Build with PyInstaller (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          pyinstaller src/file_organizer/__main__.py \
            --onefile --name kypseli --clean --paths src \
            --collect-all file_organizer --collect-all rich \
            --collect-all docx --collect-all pptx --collect-all pypdf \
            --hidden-import pandas --hidden-import cv2 \
            --hidden-import PIL --hidden-import pillow_heif \
            --hidden-import pypdf --hidden-import docx \
            --hidden-import pptx --hidden-import ebooklib \
            --hidden-import bs4 --hidden-import tiktoken

      - name: Build with PyInstaller (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          pyinstaller src/file_organizer/__main__.py `
            --onefile --name kypseli --clean --paths src `
            --collect-all file_organizer --collect-all rich `
            --collect-all docx --collect-all pptx --collect-all pypdf `
            --hidden-import pandas --hidden-import cv2 `
            --hidden-import PIL --hidden-import pillow_heif `
            --hidden-import pypdf --hidden-import docx `
            --hidden-import pptx --hidden-import ebooklib `
            --hidden-import bs4 --hidden-import tiktoken

      - name: Create Windows Installer (Inno Setup)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          iscc installer.iss

      - name: Prepare Assets for Release
        shell: bash
        run: |
          mkdir -p final_assets
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv dist/kypseli-setup.exe final_assets/${{ matrix.asset_name }}
          else
            mv dist/kypseli final_assets/${{ matrix.asset_name }}
          fi

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: final_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}