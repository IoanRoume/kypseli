[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kypseli"
version = "0.7.5"
description = "AI-powered file organization tool"
readme = "README.md"
license = {text = "Custom Non-Commercial"}
authors = [
    {name = "Ioannis Roumeliotis"}
]
keywords = ["file-organizer", "ai", "automation", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: Utilities",
]
requires-python = ">=3.10"

dependencies = [
    # CLI & UI
    "typer[all]",
    "rich",
    
    # Database
    "sqlalchemy",
    
    # File watching
    "watchdog",
    
    # Image processing
    "pillow",
    "pillow-heif",
    "opencv-python",
    
    # Tabular data
    "pandas",
    "openpyxl",
    "tabulate",
    
    # Document processing
    "pypdf",
    "python-docx",
    "python-pptx",
    "striprtf",
    "EbookLib",
    "beautifulsoup4",
    
    # Archive support (optional but included)
    "rarfile",
    "py7zr",
    
    # AI providers - core
    "openai",
    "anthropic",
    "google-generativeai",
    "tiktoken",
    
    # LangChain
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-groq>=0.2.0",
    "langchain-mistralai>=0.2.0",
    "langchain-cohere>=0.3.0",
    "langchain-ollama>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "isort",
    "mypy",
    "pyinstaller",
]

[project.scripts]
kypseli = "file_organizer.__main__:app"

[project.urls]
Homepage = "https://github.com/IoanRoume/kypseli"
Documentation = "https://github.com/IoanRoume/kypseli#readme"
Repository = "https://github.com/IoanRoume/kypseli"
Issues = "https://github.com/IoanRoume/kypseli/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100